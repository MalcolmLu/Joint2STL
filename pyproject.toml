[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joint2stl"
version = "0.4.4"
description = "Local CT and MRI musculoskeletal segmentation and STL workbench"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<2.4", "pydicom>=3,<4", "scipy>=1.14,<2",
  "scikit-image>=0.25,<0.27", "trimesh>=4,<6",
  "PySide6-Essentials==6.8.3", "vtk>=9.4,<10",
  "psutil>=5.9,<8",
  "pylibjpeg>=2,<3", "pylibjpeg-libjpeg>=2", "pylibjpeg-openjpeg>=2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
metal = ["mlx>=0.30; platform_system == 'Darwin' and platform_machine == 'arm64'"]
cuda = ["cupy-cuda12x[ctk]>=14; platform_system != 'Darwin'"]
ai = ["torch>=2.6", "torchvision>=0.21", "timm>=1.0", "Pillow>=9.1,<13"]

[project.scripts]
joint2stl = "joint2stl.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["joint2stl*"]

[tool.setuptools.package-data]
"joint2stl.vendor.medsam_lite" = ["LICENSE*", "PROVENANCE.txt"]
"joint2stl.vendor.segment_any_bone" = ["LICENSE*", "PROVENANCE.json"]
"joint2stl.vendor.scribbleprompt" = ["LICENSE", "PROVENANCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
